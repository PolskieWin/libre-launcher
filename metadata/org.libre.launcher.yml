AntiFeatures:
  NonFreeNet:
    en-US: Connects to Microsoft/Mojang authentication endpoints and downloads official Minecraft game assets from Mojang/Microsoft content delivery networks.
  NonFreeDep:
    en-US: Requires a valid Microsoft account and proprietary Minecraft Java Edition game files to function.
Categories:
  - Game Helper
License: LGPL-3.0-or-later
AuthorName: Libre Launcher Contributors
WebSite: https://polskiewin.github.io/
SourceCode: https://github.com/PolskieWin/libre-launcher
IssueTracker: https://github.com/PolskieWin/libre-launcher/issues
Changelog: https://github.com/PolskieWin/libre-launcher/releases

AutoName: Libre Launcher

RepoType: git
Repo: https://github.com/PolskieWin/libre-launcher.git

Builds:
  - versionName: '3.70'
    versionCode: 370
    commit: d24f06b3c5a71d2b8f362f080d89923345aca36b
    subdir: app_libre
    submodules: true
    sudo:
      - apt-get update
      - apt-get install -y cmake ninja-build rustup
    gradle:
      - noruntimeRelease
    rm:
      - app_libre/debug.keystore
      - app_libre/libre_release_next.jks
      - app_libre/libre_upload_next.jks
      - app_libre/src/main/jniLibs/arm64-v8a/liblibre_controls.so
    prebuild:
      - rm -rf libs/*.aar libs/*.jar
      - sed -i '/signingConfig /d' build.gradle
      - rustup toolchain install stable --profile minimal --target aarch64-linux-android
      - rustup default stable
      - cargo install --locked cargo-ndk
      - export ANDROID_NDK_HOME=$$NDK$$
      - mkdir -p src/main/jniLibs/arm64-v8a
      - (cd ../libre_controls && cargo ndk --platform 24 -t arm64-v8a -o ../app_libre/src/main/jniLibs build --release)
    scandelete:
      - app_libre/libs/
    ndk: 29.0.14206865

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9.]+$
CurrentVersion: '3.70'
CurrentVersionCode: 370
