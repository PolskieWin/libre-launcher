name: Android CI

on:
  push:
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_NEXT_KEYSTORE_PASSWORD }}
      MOJOPUB_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_NEXT_KEYSTORE_PASSWORD }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
      GRADLE_OPTS: "-Dorg.gradle.workers.max=4 -Dorg.gradle.jvmargs=-Xmx4096M"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: true

      - name: Get LTW
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          repo: MojoLauncher/LTW
          workflow: android.yml
          workflow_conclusion: success
          name: output-aar
          path: app_libre/libs

      - name: Get Mesa
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p app_libre/libs
          if [ ! -f app_libre/libs/mesa.aar ]; then
            gh run download --repo CopperLauncher/Mesa-AAR-Builder --name mesa.aar --dir app_libre/libs || true
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.5"
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Cache Shaderc Static Libraries
        id: cache-shaderc
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/android/sdk/ndk/*/sources/third_party/shaderc/libs
            /usr/local/lib/android/sdk/ndk/*/sources/third_party/shaderc/obj
          key: shaderc-ndk-v1-${{ runner.os }}-${{ hashFiles('app_libre/src/main/jni/CMakeLists.txt') }}

      - name: Pre-build Shaderc Static Libraries
        if: steps.cache-shaderc.outputs.cache-hit != 'true'
        run: |
          NDK_PATH="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          if [ -z "$NDK_PATH" ] || [ ! -d "$NDK_PATH" ]; then
            NDK_PATH=$(find /usr/local/lib/android/sdk/ndk -maxdepth 1 -mindepth 1 | sort -V | tail -n 1)
          fi
          echo "Using NDK at: $NDK_PATH"
          if [ -d "$NDK_PATH/sources/third_party/shaderc" ]; then
            $NDK_PATH/ndk-build -C "$NDK_PATH/sources/third_party/shaderc" \
              NDK_PROJECT_PATH=. \
              APP_BUILD_SCRIPT=Android.mk \
              APP_STL:=c++_static \
              APP_ABI="arm64-v8a armeabi-v7a x86 x86_64" \
              APP_PLATFORM=android-23 \
              libshaderc_combined -j$(nproc)
          fi

      # Release APKs are built on every branch of the main repo (not for pull requests, they don't get secrets)
      - name: Decode release keystore
        if: github.repository_owner == 'CopperLauncher' && github.event_name != 'pull_request'
        run: |
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > app_libre/mojo_release_next.jks
          fi

      # The Google Play upload key is only needed where the .aab is published
      - name: Decode upload keystore
        if: github.repository_owner == 'CopperLauncher' && (github.ref == 'refs/heads/v3_openjdk' || startsWith(github.ref, 'refs/tags/v'))
        run: |
          if [ -n "${{ secrets.UPLOAD_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.UPLOAD_KEYSTORE_BASE64 }}" | base64 -d > app_libre/mojo_upload_next.jks
          fi

      - name: Build all variants
        run: |
          mkdir -p out

          TASKS=":app_libre:assembleFullDebug :app_libre:assembleNoruntimeDebug :app_libre:assembleStrippedDebug"

          IS_OWNER="false"
          if [ "${{ github.repository_owner }}" = "PolskieWin" ] || [ "${{ github.repository_owner }}" = "CopperLauncher" ]; then
            IS_OWNER="true"
          fi

          if [ "$IS_OWNER" = "true" ] && [ "${{ github.event_name }}" != "pull_request" ]; then
            TASKS="$TASKS :app_libre:assembleFullPubRelease :app_libre:assembleNoruntimePubRelease :app_libre:assembleStrippedPubRelease"
          fi

          if [ "${{ github.repository_owner }}" = "CopperLauncher" ]; then
            if [ "${{ github.ref }}" = "refs/heads/v3_openjdk" ] || [[ "${{ github.ref }}" == refs/tags/v* ]]; then
              TASKS="$TASKS :app_libre:bundleFullGplay"
            fi
          fi

          ./gradlew $TASKS --parallel --build-cache --configuration-cache

      - name: Collect outputs
        run: |
          mv app_libre/build/outputs/apk/full/debug/app_libre-full-debug.apk out/LibreLauncher-debug-full.apk
          mv app_libre/build/outputs/apk/noruntime/debug/app_libre-noruntime-debug.apk out/LibreLauncher-debug-noruntime.apk
          mv app_libre/build/outputs/apk/stripped/debug/app_libre-stripped-debug.apk out/LibreLauncher-debug-stripped.apk

          [ -f app_libre/build/outputs/apk/full/pubRelease/app_libre-full-pubRelease.apk ] && \
            mv app_libre/build/outputs/apk/full/pubRelease/app_libre-full-pubRelease.apk out/LibreLauncher-release.apk || true
          [ -f app_libre/build/outputs/apk/noruntime/pubRelease/app_libre-noruntime-pubRelease.apk ] && \
            mv app_libre/build/outputs/apk/noruntime/pubRelease/app_libre-noruntime-pubRelease.apk out/LibreLauncher-noruntime-release.apk || true
          [ -f app_libre/build/outputs/apk/stripped/pubRelease/app_libre-stripped-pubRelease.apk ] && \
            mv app_libre/build/outputs/apk/stripped/pubRelease/app_libre-stripped-pubRelease.apk out/LibreLauncher-stripped-release.apk || true
          [ -f app_libre/build/outputs/bundle/fullGplay/app_libre-full-gplay.aab ] && \
            mv app_libre/build/outputs/bundle/fullGplay/app_libre-full-gplay.aab out/app-gplay.aab || true

          cd out && for f in *.apk *.aab; do [ -f "$f" ] && md5sum "$f" > "${f%.*}.md5"; done

      - name: Upload all build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LibreLauncher-all
          path: out/

      # Only v3_openjdk publishes the nightly release, other branches just upload the APK as an artifact
      - name: Release Nightly APK
        if: (github.repository_owner == 'PolskieWin' || github.repository_owner == 'CopperLauncher') && github.ref == 'refs/heads/v3_openjdk'
        uses: softprops/action-gh-release@v3
        with:
          name: Libre Launcher Nightly Builds
          prerelease: true
          tag_name: nightly
          body: |
            Libre Launcher nightly build.
            Commit hash: ${{ github.sha }}
          files: |
            out/LibreLauncher-release.apk
            out/LibreLauncher-noruntime-release.apk
            out/LibreLauncher-stripped-release.apk
            out/LibreLauncher-debug-full.apk
            out/LibreLauncher-debug-noruntime.apk
            out/LibreLauncher-debug-stripped.apk
            out/*.md5

      - name: Release Tagged APK
        if: (github.repository_owner == 'PolskieWin' || github.repository_owner == 'CopperLauncher') && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          name: Libre Launcher ${{ github.ref_name }}
          prerelease: false
          tag_name: ${{ github.ref_name }}
          body: |
            Libre Launcher ${{ github.ref_name }} release.
            Commit hash: ${{ github.sha }}
          files: |
            out/LibreLauncher-release.apk
            out/LibreLauncher-noruntime-release.apk
            out/LibreLauncher-stripped-release.apk
            out/LibreLauncher-debug-full.apk
            out/LibreLauncher-debug-noruntime.apk
            out/LibreLauncher-debug-stripped.apk
            out/*.md5

      - name: Upload onto the Google Play testing track
        continue-on-error: true
        if: github.repository_owner == 'CopperLauncher' && github.ref == 'refs/heads/v3_openjdk'
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.SERVICE_JSON }}
          packageName: org.libre.launcher
          releaseFiles: out/app-gplay.aab
          track: internal
          inAppUpdatePriority: 5
